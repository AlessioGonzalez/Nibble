# Valida el contenido y publica la web en GitHub Pages en cada push a main.
# Activa Pages en Settings > Pages > Build and deployment > Source: GitHub Actions.
# Opcional: define las variables del repositorio SUPABASE_URL y SUPABASE_ANON_KEY
# (Settings > Secrets and variables > Actions > Variables) para activar el login.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validar el contenido
        run: node scripts/validate.mjs

      # Genera ejercicios de práctica y ejecuta los de Python y JavaScript para comprobar las respuestas.
      - name: Comprobar el generador de ejercicios
        run: node scripts/check-practice.mjs

      # Java y C++: compila y ejecuta los ejercicios generados (el runner de GitHub trae javac y g++).
      - name: Compilar los ejercicios de Java y C++
        run: node scripts/check-compiled.mjs

      # Racha de secciones, contadores por dispositivo, unión de copias y borrado del progreso.
      - name: Probar la lógica del progreso
        run: node --test scripts/test-progress.mjs scripts/test-app.mjs scripts/test-security.mjs

      # Pruebas de interfaz con Playwright (10 recorridos a 375 y 1280 px; los marcados @motores también en Firefox y WebKit), antes de poner la configuración
      # de Supabase: la app se prueba en modo local.
      - name: Instalar Playwright
        run: npm ci && npx playwright install --with-deps chromium firefox webkit

      - name: Pruebas de interfaz
        run: npm run e2e

      - name: Configurar Supabase
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Opcional: la variable SUPABASE_GOOGLE=false quita el botón de Google.
          SUPABASE_GOOGLE: ${{ vars.SUPABASE_GOOGLE }}
          # Opcional: clave pública (site key) de Cloudflare Turnstile para el CAPTCHA de registro y acceso.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          node -e "require('fs').writeFileSync('assets/js/config.js', 'window.SINTAXIS_CONFIG = ' + JSON.stringify({ supabaseUrl: process.env.SUPABASE_URL, supabaseAnonKey: process.env.SUPABASE_ANON_KEY, google: process.env.SUPABASE_GOOGLE !== 'false', captchaSiteKey: process.env.TURNSTILE_SITE_KEY || '' }) + ';\n')"

      # Sin Supabase, las sugerencias se envían como incidencias (issues) de este repositorio.
      - name: Enlace de sugerencias
        run: |
          echo "window.SINTAXIS_CONFIG.feedbackUrl = window.SINTAXIS_CONFIG.feedbackUrl || 'https://github.com/${{ github.repository }}/issues/new';" >> assets/js/config.js

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r index.html privacidad.html terminos.html manifest.webmanifest sw.js assets content .well-known _site/
          # Los logos de marca (assets/brand) no los usa ninguna página publicada.
          rm -rf _site/assets/brand
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
