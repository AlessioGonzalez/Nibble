<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Entorno aislado para ejecutar el JavaScript del alumno. La web lo abre en <iframe sandbox="allow-scripts">
     (origen opaco: sin sesión, localStorage, IndexedDB ni cookies de Nibble). CSP propia: permite eval (el código
     del alumno) y Workers desde blob:, y bloquea la red (connect-src 'none'). Nada de esto afecta a la web. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Nibble sandbox</title>
</head>
<body>
<script src="assets/js/sandbox.js"></script>
</body>
</html>
