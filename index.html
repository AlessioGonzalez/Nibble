<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- CSP en meta (GitHub Pages no permite cabeceras propias). Todo se sirve desde la propia web salvo la API de Supabase y el CAPTCHA (Cloudflare Turnstile, solo si está activado).
     frame-ancestors no funciona en meta: lo cubre theme.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Nibble</title>
<meta name="description" content="Nibble: aprende Python, Java, JavaScript y C++ byte a byte, con retos de 30 días, niveles que mezclan elegir y escribir código, y Kibi, tu hámster programador.">
<meta name="theme-color" content="#F4F2EC">
<script src="assets/js/theme.js"></script>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nibble">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
